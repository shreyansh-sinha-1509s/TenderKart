<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TenderKart - Contact Support</title>
  <link rel="icon" type="image/jpeg" href="/images/logo.jpg" />
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Contact grid layout */
    #contact-split {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 3rem;
      align-items: center;
    }
    
    @media (max-width: 900px) {
      #contact-split {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Sticky Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Contact Section -->
  <main style="flex: 1; padding: 4rem 0;">
    <div class="container" style="display: flex; flex-direction: column; gap: 3rem;">
      <div style="text-align: center; display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto;">
        <span class="badge badge-blue" style="width: fit-content; align-self: center;">COMMUNICATION GATEWAY</span>
        <h1 style="font-size: 2.5rem; font-weight: 850; color: var(--text-primary); letter-spacing: -1px; line-height: 1.2;">Get in Touch</h1>
        <p style="font-size: 1.05rem; color: var(--text-secondary);">Have questions about bid filing? Send us an inquiry and our coordinators will reach out.</p>
      </div>

      <!-- Split Layout -->
      <div id="contact-split">
        <!-- Contact Form -->
        <div class="card" style="padding: 2.5rem; display: flex; flex-direction: column; gap: 24px; box-shadow: var(--shadow-premium);">
          <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--text-primary);">Send a Message</h2>
          <form id="contact-form" style="display: flex; flex-direction: column; gap: 18px;">
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="contact-name" style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">Your Name</label>
              <input type="text" id="contact-name" class="form-input" placeholder="e.g. Shreyansh Kumar" required />
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="contact-email" style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">Official Email</label>
              <input type="email" id="contact-email" class="form-input" placeholder="e.g. bids@buildcorp.com" required />
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="contact-message" style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">Message / Inquiry</label>
              <textarea id="contact-message" class="form-input" rows="4" placeholder="Detail your inquiries regarding documentation, categories, or technical issues..." required style="resize: vertical;"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="border: none; width: 100%; margin-top: 6px;">Submit Inquiry</button>
          </form>
        </div>

        <!-- GIS SVG Map representation -->
        <div style="display: flex; flex-direction: column; gap: 1.5rem; text-align: center;">
          <h3 style="font-size: 1.2rem; font-weight: 800; color: var(--text-primary);">Regional Headquarters</h3>
          <div style="max-width: 400px; width: 100%; margin: 0 auto;">
            <svg viewBox="0 0 400 300" width="100%" height="100%" style="overflow: visible;">
              <defs>
                <radialGradient id="mapGlow" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#16A085" stop-opacity="0.15" />
                  <stop offset="100%" stop-color="#16A085" stop-opacity="0" />
                </radialGradient>
              </defs>

              <!-- Map Outline -->
              <path d="M 50,150 L 120,50 L 250,60 L 350,130 L 320,240 L 150,260 L 50,150" fill="var(--bg-secondary)" stroke="var(--border-color)" stroke-width="2.5" />
              <path d="M 120,50 Q 200,160 250,60" fill="none" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4" />
              <path d="M 150,260 Q 220,160 320,240" fill="none" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4" />

              <!-- GIS nodes -->
              <g transform="translate(180, 140)">
                <circle cx="0" cy="0" r="40" fill="url(#mapGlow)" />
                <circle cx="0" cy="0" r="6" fill="#0B6B57" />
                <circle cx="0" cy="0" r="12" fill="none" stroke="#20B2A6" stroke-width="1.5" class="animate-pulse-subtle" />
                <text x="0" y="22" text-anchor="middle" fill="var(--text-primary)" fontSize="10" fontWeight="bold">HQ Hub</text>
              </g>

              <g transform="translate(100, 90)">
                <circle cx="0" cy="0" r="4" fill="#16A085" />
                <text x="0" y="16" text-anchor="middle" fill="var(--text-secondary)" fontSize="9">Nodal Office</text>
              </g>

              <g transform="translate(280, 190)">
                <circle cx="0" cy="0" r="4" fill="#10B981" />
                <text x="0" y="16" text-anchor="middle" fill="var(--text-secondary)" fontSize="9">State Cell</text>
              </g>
            </svg>
          </div>
          <p style="font-size: 0.85rem; color: var(--text-muted);">Interactive GIS Location Map (Salt Lake Sector V, Kolkata)</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Toast overlay -->
  <div id="toast-container"></div>

  <script src="/app.js"></script>
</body>
</html>
