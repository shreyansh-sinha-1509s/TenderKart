<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TenderKart - Sign In</title>
  <link rel="icon" type="image/jpeg" href="images/logo.jpg" />
  <link rel="stylesheet" href="style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Sticky Navbar placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- Login Card Section -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem;">
    <div class="card" style="max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 22px; padding: 2.5rem; box-shadow: var(--shadow-premium);">
      <div style="text-align: center; display: flex; flex-direction: column; gap: 8px;">
        <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--text-primary);">Sign In to TenderKart</h2>
        <p style="font-size: 0.9rem; color: var(--text-secondary);">Enter your registered email or username and password. Your portal access is identified automatically.</p>
      </div>

      <!-- Inline Alert for Pending Approval / Auth Errors -->
      <div id="login-status-alert" style="display: none; padding: 12px 14px; border-radius: 10px; font-size: 0.85rem; line-height: 1.45; font-weight: 500;"></div>

      <form id="login-form" style="display: flex; flex-direction: column; gap: 18px;" autocomplete="on">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="usernameOrEmail" style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">Email or Username</label>
          <input type="text" id="usernameOrEmail" class="form-input" placeholder="Enter your email or username" required />
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="password" style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" required />
        </div>
        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="margin-top: 6px; width: 100%; border: none;">Sign In</button>
      </form>

      <div style="border-top: 1px solid var(--border-color); padding-top: 16px; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
        <span>Don't have an account? </span>
        <a href="register.html" style="color: var(--color-primary); font-weight: 600;">Register as Contractor or Manager</a>
      </div>
    </div>
  </main>

  <!-- Footer placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
