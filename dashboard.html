<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TenderKart - Contractor Dashboard Workspace</title>
  <link rel="icon" type="image/jpeg" href="images/logo.jpg" />
  <link rel="stylesheet" href="style.css">
  <style>
    /* Dashboard split layout */
    #dashboard-split {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
    }
    
    @media (max-width: 900px) {
      #dashboard-split {
        grid-template-columns: 1fr;
      }
    }

    .tab-btn {
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: var(--transition-smooth);
    }

    .tab-btn:hover {
      background-color: var(--bg-secondary);
      color: var(--text-primary);
    }
  </style>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Sticky Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Dashboard Content -->
  <main style="flex: 1; padding: 3rem 0;">
    <div class="container" style="display: flex; flex-direction: column; gap: 2rem;">
      <!-- Profile Header banner -->
      <div class="card" style="padding: 2rem; background: linear-gradient(135deg, var(--bg-card) 0%, rgba(var(--primary-rgb), 0.03) 100%); display: flex; align-items: center; gap: 24px; flex-wrap: wrap; border: 1px solid rgba(var(--primary-rgb), 0.1);">
        <div style="height: 64px; width: 64px; border-radius: 16px; background-color: var(--color-primary); color: #FFFFFF; font-size: 1.75rem; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.2);">
          💼
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; flex: 1;">
          <h2 id="profile-name" style="font-size: 1.5rem; font-weight: 850; color: var(--text-primary);">Contractor Company</h2>
          <p id="profile-email" style="font-size: 0.85rem; color: var(--text-secondary);">bids@company.com</p>
        </div>
      </div>

      <!-- Split workspace -->
      <div id="dashboard-split">
        <!-- Sidebar Navigation -->
        <aside style="display: flex; flex-direction: column; gap: 1rem; height: fit-content;">
          <div class="card" style="padding: 1rem; display: flex; flex-direction: column; gap: 8px;">
            <button onclick="switchTab('saved')" class="tab-btn" id="btn-saved">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
              <span>Saved Tenders</span>
              <span class="badge badge-blue" style="margin-left: auto;" id="saved-count">0</span>
            </button>
            <button onclick="switchTab('notifications')" class="tab-btn" id="btn-notifications">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span>Notifications</span>
              <span class="badge badge-orange" style="margin-left: auto;" id="notif-count">0</span>
            </button>
          </div>
        </aside>

        <!-- Main workspace items panels -->
        <section style="display: flex; flex-direction: column; gap: 1.5rem;">
          <!-- Panel 1: Saved Tenders list -->
          <div id="tab-saved" class="card" style="padding: 2rem; display: flex; flex-direction: column; gap: 20px;">
            <h3 style="font-size: 1.2rem; font-weight: 800; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">Saved Bids Tracking List</h3>
            <div style="display: flex; flex-direction: column; gap: 16px;" id="saved-list">
              <!-- Dynamic bookmarks list -->
            </div>
          </div>

          <!-- Panel 2: Notifications log -->
          <div id="tab-notifications" class="card" style="padding: 2rem; display: flex; flex-direction: column; gap: 20px; display: none;">
            <h3 style="font-size: 1.2rem; font-weight: 800; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">System Alerts & Logs</h3>
            <div style="display: flex; flex-direction: column; gap: 16px;" id="notifications-list">
              <!-- Dynamic notifications log -->
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- Footer placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Toast overlay -->
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
