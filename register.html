<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TenderKart - Contractor Registration</title>
  <link rel="icon" type="image/jpeg" href="images/logo.jpg" />
  <link rel="stylesheet" href="style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Sticky Navbar placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- Register Card Section -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3.5rem 1.5rem;">
    <div class="card" style="max-width: 500px; width: 100%; display: flex; flex-direction: column; gap: 22px; padding: 2.5rem; box-shadow: var(--shadow-premium);">
      <div style="text-align: center; display: flex; flex-direction: column; gap: 8px;">
        <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--text-primary); margin: 0;">Create Contractor Account</h2>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin: 0;">
          Register as a contractor to bookmark tenders, generate AI summaries, and track your portal applications.
        </p>
      </div>

      <div style="background: rgba(var(--primary-rgb), 0.06); border: 1px solid rgba(var(--primary-rgb), 0.2); border-radius: 10px; padding: 10px 14px; font-size: 0.8rem; color: var(--text-secondary); line-height: 1.45;">
        Public registration creates a <strong>Contractor</strong> account only. Central Admin access is managed internally.
      </div>

      <!-- Register as Contractor Form -->
      <form id="register-contractor-form" style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="reg-con-company" style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">Company / Firm Name *</label>
          <input type="text" id="reg-con-company" class="form-input" placeholder="e.g. BuildCorp Infrastructure Pvt. Ltd." required />
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="reg-con-name" style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">Full Name *</label>
          <input type="text" id="reg-con-name" class="form-input" placeholder="e.g. Aarav Patel" required />
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="reg-con-email" style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">Email Address *</label>
          <input type="email" id="reg-con-email" class="form-input" placeholder="e.g. aarav@buildcorp.in" required />
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="reg-con-username" style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">Username *</label>
          <input type="text" id="reg-con-username" class="form-input" placeholder="e.g. buildcorp_aarav" required />
        </div>
        <div class="grid-2" style="gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label for="reg-con-password" style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">Password *</label>
            <input type="password" id="reg-con-password" class="form-input" placeholder="Min. 6 characters" required />
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label for="reg-con-confirm" style="font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">Confirm Password *</label>
            <input type="password" id="reg-con-confirm" class="form-input" placeholder="Re-enter password" required />
          </div>
        </div>
        <button type="submit" id="btn-reg-contractor" class="btn btn-primary" style="margin-top: 6px; width: 100%; border: none;">Create Contractor Account</button>
      </form>

      <div style="border-top: 1px solid var(--border-color); padding-top: 14px; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
        <span>Already have an account? </span>
        <a href="login.html" style="color: var(--color-primary); font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </main>

  <!-- Footer placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
